name: Update Dashboard

on:
  push:
    paths:
      - 'data/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ETL (skip if raw data missing)
        run: |
          if [ -d "data/garmin" ] && ls data/garmin/*.json 1>/dev/null 2>&1; then
            python scripts/etl.py
          else
            echo "Raw Garmin JSONs not in repo (gitignored). Using pre-processed CSVs."
          fi

      - name: Generate static charts
        run: python scripts/generate_charts.py

      - name: Generate interactive dashboard
        run: python scripts/generate_interactive.py

      - name: Commit updated charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/ data/processed/
          git diff --cached --quiet || git commit -m "chore: regenerate dashboard charts"
          git push

  deploy-pages:
    needs: regenerate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest (after chart commit)
        run: git pull origin main

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/interactive/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
